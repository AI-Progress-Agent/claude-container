# The tools and checks for working on the kit itself. CI runs the same
# tasks. image/mise.toml is a different file: the tools the base image
# installs for every repo.

[settings]
# mise resolves no tool version younger than seven days, the same window the
# image uses for Claude, mise and its tools.
minimum_release_age = "7d"

[tools]
shellcheck = "0.11"
# uv runs the Python checks, and installs the Python that
# kit/.python-version names.
uv = "0.12"

[tasks.check]
description = "Run shellcheck, the Python checks and the tests that need no Docker"
depends = ["check:shell", "check:python"]

# Add a new shell script here.
[tasks."check:shell"]
description = "Run shellcheck over the kit's shell scripts"
run = "shellcheck -x kit/cc kit/cc-local.bash stub/cc image/add-user image/release-before image/cc-forward-notify example/docker/kit.sh test/smoke.sh"

# The Python project in kit/: ruff, basedpyright in strict mode, and the
# pytest tests. Most run the launcher through the stub with a fake docker.
# The rest call the planning step on fixture folders.
# --frozen fails when uv.lock is out of date, rather than changing it.
[tasks."check:python"]
description = "Run ruff, basedpyright and the pytest tests in kit/"
dir = "{{config_root}}/kit"
run = [
  "uv run --frozen ruff format --check",
  "uv run --frozen ruff check",
  "uv run --frozen basedpyright",
  "uv run --frozen pytest",
]

# Builds the base image as claude-container:dev, the tag KIT_DEV uses. Then
# builds the example repo's layer on it and checks what a user sees inside.
# CI runs the same smoke test before it publishes.
[tasks.build]
description = "Build the base image and smoke-test the example repo's layer on it"
run = "test/smoke.sh"
