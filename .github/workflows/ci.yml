# Checks every change to the kit. One job runs shellcheck, the Python checks
# and the tests that need no Docker. The other builds the base image and the
# example repo's layer on it, then smoke-tests what a user sees inside. Both
# run natively on GitHub's arm64 runner, the one architecture the image
# supports.
#
# Actions are pinned to a commit hash, and .github/dependabot.yml bumps them.
# The mise binary is pinned by hand, because mise.toml cannot pin mise itself
# and an unpinned mise-action asks GitHub's API for the newest release on
# every run.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Pushes to main each run
# to the end, so every commit on main gets checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: shellcheck, Python checks and tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
          install_args: shellcheck uv
      - run: mise run check

  build:
    name: build and smoke test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # A throwaway registry, so each pull request pushes the image the way the
    # release job does. Dependabot does not read this pin. Bump it by hand.
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: test/smoke.sh

      # The release job's push, with its login, against the local registry.
      # Every layer must arrive as zstd, both tags must share one digest, and
      # the image must pull back and run.
      - name: Push as the release job does, then pull back
        env:
          TLS_VERIFY: "false"
          REF: localhost:5000/claude-container
        run: |
          echo ci | docker login localhost:5000 -u ci --password-stdin
          digest=$(.github/push-image claude-container:dev "$REF:ci" latest)
          accept='Accept: application/vnd.oci.image.manifest.v1+json'
          url=http://localhost:5000/v2/claude-container/manifests
          curl -fsS -H "$accept" "$url/ci" |
            jq -e '.layers | length > 0 and all(.mediaType | endswith("+zstd"))' >/dev/null ||
            { echo "a layer is not zstd" >&2; exit 1; }
          for tag in ci latest; do
            got=$(curl -fsS -o /dev/null -D - -H "$accept" "$url/$tag" |
              sed -n 's/^docker-content-digest: *//Ip' | tr -d '\r')
            [ "$got" = "$digest" ] || { echo "$tag is $got, not $digest" >&2; exit 1; }
          done
          docker pull "$REF@$digest"
          docker run --rm "$REF@$digest" sh -c 'claude --version && agent-browser --version'
