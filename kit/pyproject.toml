# The launcher's Python project. The launcher is the package in src/launcher,
# and kit/cc runs it. It uses only the standard library, so a run installs
# nothing. The Dockerfile copies kit/ into the image, and .dockerignore keeps
# the tests and the virtual environment out of it.

[project]
name = "claude-container-kit"
version = "0"
description = "The claude-container launcher"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright",
    "pytest",
    "pytest-xdist",
    "ruff",
]

[tool.uv]
package = false
# uv resolves no package younger than seven days, the same window mise and
# the image use.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The unit tests import the launcher.
pythonpath = ["src"]
# Each test waits on the launcher's watcher, so the tests run in parallel.
addopts = ["--strict-markers", "--strict-config", "-n", "auto"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "PTH"]
# The formatter wraps code. A long message the launcher prints stays whole,
# so a search finds it.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The launcher keeps each path as a string, spelled as git and bash spell it.
# pathlib would drop a trailing slash or a "." on the way, and the launcher
# compares paths by their spelling.
"src/**" = ["PTH"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
