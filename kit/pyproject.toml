# The launcher's Python project. It has no code yet: the tests in tests/
# pin what the bash launcher, cc, does, so a Python launcher can be held to
# the same behavior. The Dockerfile copies kit/ into the image, and
# .dockerignore keeps the tests and the virtual environment out of it.

[project]
name = "claude-container-kit"
version = "0"
description = "The claude-container launcher"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright",
    "pytest",
    "pytest-xdist",
    "ruff",
]

[tool.uv]
package = false
# uv resolves no package younger than seven days, the same window mise and
# the image use.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Each test waits on the launcher's watcher, so the tests run in parallel.
addopts = ["--strict-markers", "--strict-config", "-n", "auto"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "PTH"]
# The formatter wraps code. A long message the launcher prints stays whole,
# so a search finds it.
ignore = ["E501"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
