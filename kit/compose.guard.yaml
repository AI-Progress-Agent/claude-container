# The repo's .git/hooks and .git/config, read-only. The launcher stacks this
# file on compose.yaml unless docker/kit.toml sets host_git_guard = false.
#
# Git reads commands from both. A hook or a config entry such as
# core.fsmonitor written here would run on the Mac at its next git command,
# and git status would not show it. Commits and pushes still work. Anything
# that writes the config, such as setting a branch's upstream, fails inside.
# The launcher also flags the config immutable on the host for the session,
# so do that on the host after the session ends.
services:
  claude:
    volumes:
      - ${REPO_GIT:?run docker/cc, not docker compose}/hooks:${REPO_GIT}/hooks:ro
      - ${REPO_GIT}/config:${REPO_GIT}/config:ro
